---
<section class="hero hero--home">
  <h1 class="sr">Jergušino</h1>
  <div class="lockup">
    {% include lead.html text="i am" hidden=true %}
    <div class="wm-mask">{% include wordmark.svg %}</div>
  </div>
</section>

<section class="quiet-break" aria-labelledby="proj-h">
  <h2 id="proj-h" class="quiet-line">projekty</h2>
</section>

<section class="list">
  {% include project-list.html limit=6 %}
  <p class="more"><a href="{{ '/projects/' | relative_url }}">všetky projekty {% include arrow.svg %}</a></p>
</section>

<script>
  /* the bar falls from the very top of the screen: measure how far that is, in the wordmark's own units */
  (function () {
    var m = document.querySelector('.wm-mask'), b = document.querySelector('.wm-bar');
    if (!m || !b) return;
    function set() {
      var r = m.getBoundingClientRect();
      var k = r.width / 1019;                       /* screen px per drawing unit */
      b.style.setProperty('--drop', '-' + ((r.top + window.scrollY) / k + 50).toFixed(1) + 'px');
    }
    set();
    window.addEventListener('resize', set);
  })();
</script>
