<header class="top">
  <a class="brand" href="{{ '/' | relative_url }}" aria-label="Jergušino, domov">
    <img class="logo-paper" src="{{ '/assets/img/logo-paper.svg' | relative_url }}" alt="" width="570" height="112">
    <img class="logo-ink" src="{{ '/assets/img/logo-ink.svg' | relative_url }}" alt="" width="570" height="112">
  </a>
  <button type="button" class="menu-btn" aria-label="Menu" aria-expanded="false" aria-controls="site-nav"><span></span><span></span></button>
  <nav class="nav" id="site-nav" aria-label="Hlavná navigácia">
    <a class="pill" href="{{ '/plagaty/' | relative_url }}"{% if page.body_class == "plagaty" %} aria-current="page"{% endif %}>Plagáty</a>
    <a class="pill" href="{{ '/spoluprace/' | relative_url }}"{% if page.body_class == "spoluprace" or page.body_class == "brand-page" %} aria-current="page"{% endif %}>Spolupráce</a>
    <a class="pill" href="{{ '/kontakt/' | relative_url }}"{% if page.body_class == "kontakt-page" %} aria-current="page"{% endif %}>Kontakt</a>
  </nav>
</header>
