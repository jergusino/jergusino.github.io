{% assign items = site.projects | sort: "date" | reverse %}
<ul class="pgrid">
  {% for p in items limit: include.limit %}
  {% unless p.placeholder %}
  {% assign th = p.thumb | default: p.cover %}
  {% if th %}
  <li class="pcard rv" data-type="{{ p.type }}" data-tags="{{ p.tags | join: ' ' }}" data-date="{{ p.date | date: '%Y%m%d' }}" data-title="{{ p.title | escape }}" data-search="{{ p.title | append: ' ' | append: p.type | append: ' ' | append: p.summary | downcase | escape }}">
    <a href="{{ p.url | relative_url }}" aria-label="{{ p.title | escape }}"{% if p.color %} style="background-color: {{ p.color }}"{% endif %}>
      <img src="{{ th | relative_url }}" alt="{{ p.cover_alt | default: p.title | escape }}" width="720" height="1020" loading="lazy">
    </a>
    <p class="cap"><span>{{ p.title }}</span><span>{{ p.date | date: "%Y" }}</span></p>
  </li>
  {% endif %}
  {% endunless %}
  {% endfor %}
</ul>
