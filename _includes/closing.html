{% comment %} Closing slide: yellow, the sign-off as the headline, a button, a huge asterisk cut by the corner. {% endcomment %}
<section class="closing" aria-labelledby="closing-h">
  <div class="closing-ast spin" aria-hidden="true">{% include asterisk.svg %}</div>
  <p class="label">Spolupráca alebo&nbsp;otázka</p>
  <h2 id="closing-h" class="display rv">Žltá medzi<br>sivými.</h2>
  <a class="btn" href="{{ '/kontakt/' | relative_url }}"><span class="circ">{% include arrow.svg %}</span><span class="btn-t">Napíš mi</span></a>
</section>
