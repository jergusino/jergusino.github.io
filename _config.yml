# ── Jergušino portfolio (brand v2) ──────────────────────────────────────────────────────
title: Jergušino
description: "Jergušino. Žltá medzi sivými."
lang: sk
url: "https://jergusino.com"   # custom domain (see CNAME)
baseurl: ""

# Contact. Shown on the contact page (/kontakt/).
handle: "@jergusino"
instagram: "https://www.instagram.com/jergusino/"
email: "mail@jergusino.com"
google_analytics: "G-V0Z8P5FQHC"   # Google Analytics 4 Measurement ID, e.g. "G-XXXXXXXXXX" (see README)

# More links for the contact page, shown under Instagram. Empty for now.
# Add one line per link, e.g.:
#   - label: youtube
#     url: https://www.youtube.com/@jergusino
social: []

collections:
  plagaty:
    output: true
    permalink: /plagaty/:name/

defaults:
  - scope:
      path: ""
      type: plagaty
    values:
      layout: plagat
      body_class: plagat

plugins:
  - jekyll-sitemap
  - jekyll-redirect-from

markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: ["sbquo", "lsquo", "bdquo", "ldquo"]   # Slovak quotes: „ “

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - tools
  - node_modules
  - vendor
