# ── Jergušino portfolio ──────────────────────────────────────────────────────
title: Jergušino
description: "som Jergušino."
lang: sk
url: "https://jergusino.com"   # custom domain (see CNAME)
baseurl: ""

# Contact. Shown on the contact page (/kontakt/).
handle: "@jergusino"
instagram: "https://www.instagram.com/jergusino/"
email: "mail@jergusino.com"
google_analytics: "G-16237384345"   # Google Analytics 4 Measurement ID, e.g. "G-XXXXXXXXXX" (see README)

# More links for the contact page, shown under Instagram. Empty for now.
# Add one line per link, e.g.:
#   - label: youtube
#     url: https://www.youtube.com/@jergusino
social: []

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
      body_class: project
      viewer: true

plugins:
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: ["sbquo", "lsquo", "bdquo", "ldquo"]   # Slovak quotes: „ “

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - tools
  - node_modules
  - vendor
