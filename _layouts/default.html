<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.summary | default: site.description | escape }}">
  <meta name="theme-color" content="#0E0E0E">
  <meta name="color-scheme" content="dark">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}">
  <meta property="og:description" content="{{ page.summary | default: site.description | escape }}">
  <meta property="og:image" content="{{ '/assets/img/og.png' | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}">
  <link rel="preload" href="{{ '/assets/fonts/BricolageGrotesque-ExtraBold.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/BricolageGrotesque-Medium.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  {% include analytics.html %}
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}">
</head>
<body class="{{ page.body_class }}">
  <script>document.documentElement.classList.add("js")</script>
  <a class="skip" href="#top">preskočiť na obsah</a>
  {% include header.html %}

  <main id="top" tabindex="-1">
    {{ content }}
  </main>
  {% unless page.no_closing %}{% include closing.html %}{% endunless %}


  <script src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}" defer></script>
  {% if page.viewer %}<script src="{{ '/assets/js/viewer.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}" defer></script>{% endif %}
  {% if page.filter %}<script src="{{ '/assets/js/filter.js' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}" defer></script>{% endif %}
</body>
</html>
